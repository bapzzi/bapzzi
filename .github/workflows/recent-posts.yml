name: recent-posts

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://bapzzi.tistory.com/rss"
          max_post_count: 5
          # Tistory answers 406 to "application/rss+xml"; "*/*" returns the feed
          accept_header: "*/*"
          # Tistory titles are already entity-encoded; encoding again shows "&lt;" literally
          disable_html_encoding: true
          # Titles contain "]" which breaks markdown links, so emit HTML links
          template: '<a href="$url">$title</a><br/>$newline'
          commit_message: "chore: update recent posts"
